name: canonical-guardrail

on:
  push:
    branches: [ canonical-retail-rebuild-v1 ]
  pull_request:
    branches: [ canonical-retail-rebuild-v1 ]
  workflow_dispatch:

jobs:
  prove-no-assumptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guardrail
        run: python tools/prove_no_assumptions.py
      - name: Guardrail self-test
        run: python tests/test_guardrail.py
      - name: Derived witness integrity
        run: python tests/test_r6_state_edge_index.py
      - name: R6 event/move pairing summary
        run: python tests/test_r6_event_move_pairing_summary.py
      - name: Pairing prover syntax
        run: python -m py_compile tools/prove_r6_event_move_pairing.py
      - name: StartOpponentAnm dispatch summary
        run: python tests/test_r6_start_opponent_dispatch_summary.py
      - name: StartOpponentAnm prover syntax
        run: python -m py_compile tools/prove_start_opponent_dispatch.py
      - name: InitAnimation closure summary
        run: python tests/test_r6_init_animation_summary.py
      - name: InitAnimation prover syntax
        run: python -m py_compile tools/prove_init_animation_closure.py

      - name: StartAnm closure summary
        run: python tests/test_r6_start_anm_summary.py
      - name: StartAnm prover syntax
        run: python -m py_compile tools/prove_start_anm_closure.py

      - name: StartOpponentAnmM closure summary
        run: python tests/test_r6_start_opponent_anm_m_summary.py
      - name: StartOpponentAnmM prover syntax
        run: python -m py_compile tools/prove_start_opponent_anm_m_closure.py

      - name: StartSlotAnm Immediately closure summary
        run: python tests/test_r6_start_slot_anm_immediate_summary.py
      - name: StartSlotAnm Immediately prover syntax
        run: python -m py_compile tools/prove_start_slot_anm_immediate_closure.py

      - name: ReqSlotAnm closure summary
        run: python tests/test_r6_req_slot_anm_summary.py
      - name: ReqSlotAnm prover syntax
        run: python -m py_compile tools/prove_req_slot_anm_closure.py

      - name: ReqBasicAnm closure summary
        run: python tests/test_r6_req_basic_anm_summary.py
      - name: ReqBasicAnm prover syntax
        run: python -m py_compile tools/prove_req_basic_anm_closure.py

      - name: InitAnmWork reset summary
        run: python tests/test_init_anm_work_summary.py
      - name: InitAnmWork prover syntax
        run: python -m py_compile tools/prove_init_anm_work.py

      - name: Request siblings summary
        run: python tests/test_request_siblings_summary.py
      - name: Request siblings prover syntax
        run: python -m py_compile tools/prove_request_siblings.py

      - name: PreprocessEachAnm summary
        run: python tests/test_preprocess_each_anm_summary.py
      - name: PreprocessEachAnm prover syntax
        run: python -m py_compile tools/prove_preprocess_each_anm.py

      - name: Full UpdateAnimation summary
        run: python tests/test_update_animation_full_summary.py
      - name: Full UpdateAnimation prover syntax
        run: python -m py_compile tools/prove_update_animation_full.py

      - name: PlayAnimationSE summary
        run: python tests/test_play_animation_se_summary.py
      - name: PlayAnimationSE prover syntax
        run: python -m py_compile tools/prove_play_animation_se.py
